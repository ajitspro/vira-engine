name: Vira 1080p Render Engine

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: "Unique Render ID"
        required: true
      source_type:
        description: "yt or file"
        required: true
        default: "yt"
      source_url:
        description: "YouTube URL or Uploaded File URL"
        required: true
      start_time:
        description: "Start HH:MM:SS"
        required: true
      end_time:
        description: "End HH:MM:SS"
        required: true
      caption_style:
        description: "bold_yellow | neon_glow | clean_white"
        required: false
        default: "bold_yellow"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, Fonts & Python Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade yt-dlp requests groq

      - name: Render 1080p Vertical Clip
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: vira-clips
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          RENDER_ID: ${{ github.event.inputs.render_id }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          START_TIME: ${{ github.event.inputs.start_time }}
          END_TIME: ${{ github.event.inputs.end_time }}
          CAPTION_STYLE: ${{ github.event.inputs.caption_style }}
        run: python render_worker.py
        
